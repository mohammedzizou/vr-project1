<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Markerless Native AR Viewer (Apple ARKit & Google ARCore)</title>
    <!-- Google Model Viewer (Official WebXR / ARKit / ARCore component) -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: radial-gradient(circle at center, #0e1a3a 0%, #050b1a 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: white;
            overflow: hidden;
            width: 100vw; height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Header */
        header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .badge {
            background: rgba(0, 212, 255, 0.15);
            border: 1px solid #00d4ff;
            color: #00d4ff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .selector {
            display: flex;
            background: rgba(20, 35, 75, 0.8);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 20px;
            padding: 3px;
            gap: 4px;
        }
        .selector button {
            background: transparent;
            border: none;
            color: #bcd;
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .selector button.active {
            background: #00d4ff;
            color: #050b1a;
            font-weight: 800;
        }

        /* 3D Model Viewer Canvas */
        model-viewer {
            flex: 1;
            width: 100%;
            height: 100%;
            --poster-color: transparent;
        }

        /* AR Activation Button */
        #ar-button {
            background: linear-gradient(135deg, #00d4ff, #387aff);
            border-radius: 30px;
            border: none;
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            padding: 14px 28px;
            font-size: 15px;
            font-weight: 700;
            color: #050b1a;
            box-shadow: 0 8px 30px rgba(0, 212, 255, 0.4);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 20;
            transition: transform 0.2s;
        }
        #ar-button:active {
            transform: translateX(-50%) scale(0.96);
        }

        /* Animation Bar for Robot */
        #anim-bar {
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            background: rgba(10, 20, 50, 0.85);
            backdrop-filter: blur(12px);
            padding: 6px 10px;
            border-radius: 20px;
            border: 1px solid rgba(0, 212, 255, 0.3);
            z-index: 20;
        }
        .anim-chip {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            cursor: pointer;
        }
        .anim-chip:active {
            border-color: #00d4ff;
            color: #00d4ff;
        }

        /* Instructions */
        .instructions {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(5, 12, 35, 0.75);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 12px;
            color: #bcd;
            border: 1px solid rgba(0, 212, 255, 0.2);
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <header>
        <div class="badge">NATIVE MARKERLESS AR</div>
        <div class="selector">
            <button class="active" onclick="setModel('robot')">🤖 Robot</button>
            <button onclick="setModel('astronaut')">🧑‍🚀 Astronaut</button>
        </div>
    </header>

    <div class="instructions">
        Rotate & Zoom with your fingers &bull; Tap button to place in real room
    </div>

    <!-- Google Model Viewer component -->
    <model-viewer
        id="viewer"
        src="robot.glb"
        ar
        ar-modes="webxr scene-viewer quick-look"
        camera-controls
        auto-rotate
        auto-rotate-delay="1000"
        shadow-intensity="1.5"
        shadow-softness="0.8"
        environment-image="neutral"
        exposure="1.2"
        autoplay
        animation-name="Dance"
    >
        <button slot="ar-button" id="ar-button">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <path d="M4 8V4h4M20 8V4h-4M4 16v4h4M20 16v4h-4"/>
                <circle cx="12" cy="12" r="3"/>
            </svg>
            VIEW IN YOUR ROOM (AR)
        </button>
    </model-viewer>

    <!-- Robot animation triggers -->
    <div id="anim-bar">
        <button class="anim-chip" onclick="setAnim('Dance')">💃 Dance</button>
        <button class="anim-chip" onclick="setAnim('Jump')">🦘 Jump</button>
        <button class="anim-chip" onclick="setAnim('Wave')">👋 Wave</button>
        <button class="anim-chip" onclick="setAnim('ThumbsUp')">👍 Thumbs Up</button>
        <button class="anim-chip" onclick="setAnim('Running')">🏃 Run</button>
    </div>

    <script>
        const viewer = document.getElementById('viewer');
        const animBar = document.getElementById('anim-bar');

        function setModel(type) {
            document.querySelectorAll('.selector button').forEach(b => b.classList.remove('active'));
            if (type === 'robot') {
                viewer.src = 'robot.glb';
                viewer.setAttribute('animation-name', 'Dance');
                animBar.style.display = 'flex';
                event.target.classList.add('active');
            } else {
                viewer.src = 'astronaut.glb';
                viewer.removeAttribute('animation-name');
                animBar.style.display = 'none';
                event.target.classList.add('active');
            }
        }

        function setAnim(animName) {
            viewer.animationName = animName;
        }
    </script>
</body>
</html>
