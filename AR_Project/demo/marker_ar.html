<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Next-Gen High-Fidelity AR Experience</title>
    <!-- A-Frame 1.4.0 -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <!-- A-Frame Animation Mixer for Skeletal GLTF Animations -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    <!-- AR.js for A-Frame -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0; padding: 0;
        }
        body {
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #000;
        }
        .a-enter-vr { display: none !important; }

        /* Full Screen Glassmorphism HUD */
        #hud {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
            gap: 10px;
        }
        .hud-badge {
            background: rgba(10, 20, 50, 0.85);
            border: 1px solid rgba(0, 212, 255, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 8px 14px;
            border-radius: 20px;
            color: #00d4ff;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.25);
        }
        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #ff4757;
            box-shadow: 0 0 10px #ff4757;
            transition: all 0.3s ease;
        }
        .status-dot.active {
            background: #00e696;
            box-shadow: 0 0 14px #00e696;
        }

        /* Mode Selector */
        .mode-selector {
            background: rgba(10, 20, 50, 0.9);
            border: 1px solid rgba(0, 212, 255, 0.4);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 30px;
            display: flex;
            padding: 4px;
            gap: 4px;
            pointer-events: auto;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
        }
        .mode-btn {
            background: transparent;
            border: none;
            color: #bcd;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 11.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            white-space: nowrap;
        }
        .mode-btn.active {
            background: linear-gradient(135deg, #00d4ff, #387aff);
            color: #050b1e;
            font-weight: 800;
            box-shadow: 0 2px 14px rgba(0, 212, 255, 0.5);
        }

        /* Bottom Controls Bar */
        .bottom-bar {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            pointer-events: auto;
        }
        .control-chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .chip-btn {
            background: rgba(12, 22, 54, 0.88);
            border: 1px solid rgba(0, 212, 255, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #fff;
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .chip-btn:active, .chip-btn.active {
            border-color: #00d4ff;
            color: #00d4ff;
            background: rgba(0, 212, 255, 0.2);
            box-shadow: 0 0 12px rgba(0, 212, 255, 0.3);
        }

        /* Action Buttons for Robot */
        #robot-actions {
            display: none;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .action-btn {
            background: rgba(0, 212, 255, 0.15);
            border: 1px solid #00d4ff;
            color: #00d4ff;
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 10.5px;
            font-weight: 700;
            cursor: pointer;
        }
        .action-btn:active {
            background: #00d4ff;
            color: #050b1e;
        }

        /* Info Card */
        #info-card {
            background: rgba(8, 16, 42, 0.94);
            border: 1px solid rgba(0, 212, 255, 0.5);
            border-left: 4px solid #00d4ff;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 12px 18px;
            border-radius: 12px;
            color: white;
            width: 92%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.85);
            transition: all 0.3s ease;
        }
        #info-card h3 {
            margin: 0 0 4px 0;
            font-size: 14px;
            color: #00d4ff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #info-card p {
            margin: 0;
            font-size: 11.5px;
            line-height: 1.45;
            color: #ccddee;
        }

        /* Scanner Target Reticle */
        #scanner-hint {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 220px;
            height: 220px;
            border: 2px dashed rgba(0, 212, 255, 0.5);
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 50;
            transition: opacity 0.4s ease;
            text-align: center;
            padding: 16px;
        }
        #scanner-hint.hidden {
            opacity: 0;
            visibility: hidden;
        }
        #scanner-hint span {
            color: #00d4ff;
            font-size: 11px;
            font-weight: 700;
            background: rgba(5, 12, 35, 0.88);
            padding: 6px 12px;
            border-radius: 10px;
            margin-top: 10px;
            border: 1px solid rgba(0, 212, 255, 0.35);
            letter-spacing: 0.5px;
        }

        /* Loader */
        #loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #060b1c;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: white;
            transition: opacity 0.6s ease;
        }
        .spinner {
            width: 55px; height: 55px;
            border: 3px solid rgba(0, 212, 255, 0.15);
            border-top: 3px solid #00d4ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loader">
        <div class="spinner"></div>
        <h2 style="color: #00d4ff; margin: 0 0 8px 0; font-size: 20px; letter-spacing: 1px;">AUGMENTED REALITY</h2>
        <p style="color: #9ab; font-size: 12.5px; margin: 0;">Loading High-Fidelity 3D Models & Shaders...</p>
    </div>

    <!-- Scanner Target Reticle -->
    <div id="scanner-hint">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#00d4ff" stroke-width="1.8">
            <path d="M4 8V4h4M20 8V4h-4M4 16v4h4M20 16v4h-4"/>
            <circle cx="12" cy="12" r="3" fill="#00d4ff" fill-opacity="0.3"/>
        </svg>
        <span>POINT AT HIRO MARKER</span>
    </div>

    <!-- HUD Overlay -->
    <div id="hud">
        <!-- Top bar -->
        <div class="top-bar">
            <div class="hud-badge">
                <div class="status-dot" id="status-dot"></div>
                <span id="status-text">LOOKING FOR MARKER</span>
            </div>
            
            <div class="mode-selector">
                <button class="mode-btn active" id="btn-robot" onclick="switchMode('robot')">🤖 Cyber Robot</button>
                <button class="mode-btn" id="btn-earth" onclick="switchMode('earth')">🌍 HD Earth</button>
                <button class="mode-btn" id="btn-astro" onclick="switchMode('astro')">🧑‍🚀 Astronaut</button>
            </div>
        </div>

        <!-- Bottom bar -->
        <div class="bottom-bar">
            <!-- Dynamic Actions for Robot -->
            <div id="robot-actions">
                <button class="action-btn" onclick="playAnim('Dance')">💃 Dance</button>
                <button class="action-btn" onclick="playAnim('Jump')">🦘 Jump</button>
                <button class="action-btn" onclick="playAnim('Wave')">👋 Wave</button>
                <button class="action-btn" onclick="playAnim('ThumbsUp')">👍 Thumbs Up</button>
                <button class="action-btn" onclick="playAnim('Running')">🏃 Run</button>
            </div>

            <!-- Dynamic Info Card -->
            <div id="info-card">
                <h3 id="card-title">🤖 Cyber Android Robot (Active)</h3>
                <p id="card-desc">Industry-standard animated GLTF 3D avatar with skeletal rigging. Demonstrates interactive AR avatars and responsive real-time animation control.</p>
            </div>

            <!-- Controls -->
            <div class="control-chips">
                <button class="chip-btn active" id="btn-sound" onclick="toggleSound()">🔊 Audio: ON</button>
                <button class="chip-btn" id="btn-freeze" onclick="toggleFreeze()">⏸️ Pause</button>
                <button class="chip-btn" id="btn-scale" onclick="toggleScale()">🔍 Scale: 1x</button>
            </div>
        </div>
    </div>

    <!-- A-Frame AR Scene -->
    <a-scene
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
        renderer="logarithmicDepthBuffer: true; antialias: true; colorManagement: true; physicallyCorrectLights: true;"
        vr-mode-ui="enabled: false"
    >
        <!-- Preload 3D Models and High-Resolution Textures -->
        <a-assets timeout="10000">
            <a-asset-item id="robotModel" src="robot.glb"></a-asset-item>
            <a-asset-item id="astroModel" src="astronaut.glb"></a-asset-item>
            <img id="earthMap" src="textures/earth.jpg">
            <img id="cloudsMap" src="textures/clouds.png">
            <img id="moonMap" src="textures/moon.jpg">
        </a-assets>

        <!-- Marker: Hiro -->
        <a-marker id="hiro-marker" preset="hiro">

            <!-- ======================================================== -->
            <!-- 🤖 MODEL 1: FULLY ANIMATED RIGGED CYBER ROBOT             -->
            <!-- ======================================================== -->
            <a-entity id="scene-robot" position="0 0 0" scale="0.28 0.28 0.28">
                <!-- Holographic Cyber Pedestal Base -->
                <a-cylinder position="0 0.05 0" radius="1.3" height="0.1" color="#0B132B" material="metalness: 0.8; roughness: 0.2"></a-cylinder>
                <a-ring rotation="-90 0 0" position="0 0.11 0" radius-inner="1.0" radius-outer="1.2" material="color: #00D4FF; opacity: 0.8; transparent: true"></a-ring>
                <a-ring rotation="-90 0 0" position="0 0.12 0" radius-inner="0.6" radius-outer="0.65" material="color: #00E696; opacity: 0.6; transparent: true"></a-ring>

                <!-- Floating Hologram Scanner Ring -->
                <a-ring rotation="-90 0 0" position="0 0.5 0" radius-inner="1.35" radius-outer="1.38" material="color: #00D4FF; opacity: 0.4; transparent: true"
                        animation="property: position; dir: alternate; dur: 2200; to: 0 2.2 0; loop: true; easing: easeInOutSine"></a-ring>

                <!-- The 3D Rigged Robot with skeletal animation mixer -->
                <a-entity id="robot-entity"
                    gltf-model="#robotModel"
                    position="0 0.1 0"
                    rotation="0 0 0"
                    animation-mixer="clip: Dance; loop: repeat; crossFadeDuration: 0.4"
                ></a-entity>

                <!-- 3D Holographic Label in Augmented Space -->
                <a-text value="AR INTERACTIVE AVATAR" position="0 2.6 0" align="center" color="#00D4FF" width="4.5" side="double"></a-text>
                <a-text value="Neural IK Rigging | Tap buttons below to trigger animations" position="0 2.38 0" align="center" color="#CCDDEE" width="3.2" side="double"></a-text>
            </a-entity>

            <!-- ======================================================== -->
            <!-- 🌍 MODEL 2: PHOTO-REALISTIC 3D EARTH WITH ATMOSPHERE     -->
            <!-- ======================================================== -->
            <a-entity id="scene-earth" visible="false" position="0 0.8 0" scale="1 1 1">
                <!-- Main Earth Sphere with High-Resolution NASA Texture -->
                <a-sphere
                    id="earth-sphere"
                    radius="0.55"
                    material="src: #earthMap; roughness: 0.6; metalness: 0.1"
                    animation="property: rotation; to: 0 360 0; loop: true; dur: 18000; easing: linear"
                ></a-sphere>

                <!-- Dynamic Atmospheric Cloud Layer (rotates slightly faster) -->
                <a-sphere
                    radius="0.565"
                    material="src: #cloudsMap; transparent: true; opacity: 0.55"
                    animation="property: rotation; to: 0 360 0; loop: true; dur: 14000; easing: linear"
                ></a-sphere>

                <!-- Luminous Blue Atmospheric Glow Halo -->
                <a-sphere
                    radius="0.62"
                    material="color: #00D4FF; opacity: 0.18; transparent: true; side: back"
                    animation="property: scale; dir: alternate; dur: 1500; to: 1.05 1.05 1.05; loop: true; easing: easeInOutSine"
                ></a-sphere>

                <!-- Orbiting Realistic Moon with Surface Texture -->
                <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
                    <a-sphere
                        position="1.25 0 0"
                        radius="0.14"
                        material="src: #moonMap; roughness: 0.9"
                        animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear"
                    ></a-sphere>
                </a-entity>

                <!-- Glowing Orbital Path Ring -->
                <a-ring rotation="-90 0 0" radius-inner="1.23" radius-outer="1.26" material="color: #00D4FF; opacity: 0.35; transparent: true"></a-ring>

                <!-- Floating Data Labels -->
                <a-text value="PLANET EARTH [TERRA]" position="0 1.0 0" align="center" color="#00D4FF" width="3.5" side="double"></a-text>
                <a-text value="Scale 1:12,742 km | Atmospheric Shader: Active" position="0 0.88 0" align="center" color="#CCDDEE" width="2.4" side="double"></a-text>
            </a-entity>

            <!-- ======================================================== -->
            <!-- 🧑‍🚀 MODEL 3: DETAILED HIGH-POLY ASTRONAUT                -->
            <!-- ======================================================== -->
            <a-entity id="scene-astro" visible="false" position="0 0 0" scale="0.32 0.32 0.32">
                <!-- Floating space platform -->
                <a-cylinder position="0 0.05 0" radius="1.2" height="0.1" color="#111B33" material="metalness: 0.9; roughness: 0.1"></a-cylinder>
                <a-ring rotation="-90 0 0" position="0 0.11 0" radius-inner="0.8" radius-outer="1.1" material="color: #00E696; opacity: 0.7; transparent: true"></a-ring>

                <!-- High-Poly Detailed Astronaut -->
                <a-entity
                    gltf-model="#astroModel"
                    position="0 0.1 0"
                    rotation="0 0 0"
                    animation="property: rotation; to: 0 360 0; loop: true; dur: 16000; easing: linear"
                ></a-entity>

                <!-- Text Tag -->
                <a-text value="APOLLO SPACE SUIT (EVA)" position="0 2.5 0" align="center" color="#00E696" width="4.2" side="double"></a-text>
                <a-text value="PBR Material | Photorealistic Textures & Lighting" position="0 2.3 0" align="center" color="#CCDDEE" width="2.8" side="double"></a-text>
            </a-entity>

            <!-- Physically-Correct Realistic Lighting -->
            <a-light type="ambient" color="#FFFFFF" intensity="1.2"></a-light>
            <a-light type="directional" position="2 4 3" intensity="2.5" color="#FFF8E7" castShadow="true"></a-light>
            <a-light type="point" position="-2 2 -2" intensity="1.2" color="#00D4FF"></a-light>

        </a-marker>

        <!-- Camera -->
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        // ==========================================
        // SCI-FI AUDIO SYNTHESIZER (Web Audio API)
        // ==========================================
        let audioCtx = null;
        let soundEnabled = true;

        function playSciFiSound(type) {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;
                if (type === 'found') {
                    // Futuristic tracking chirp
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.exponentialRampToValueAtTime(1400, now + 0.3);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'switch') {
                    // Hologram mode switch
                    osc.frequency.setValueAtTime(750, now);
                    osc.frequency.exponentialRampToValueAtTime(320, now + 0.18);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
                    osc.start(now);
                    osc.stop(now + 0.18);
                } else if (type === 'anim') {
                    // Action trigger sound
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.linearRampToValueAtTime(900, now + 0.1);
                    osc.frequency.linearRampToValueAtTime(600, now + 0.2);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                }
            } catch(e) {
                console.log('Audio init deferred:', e);
            }
        }

        // ==========================================
        // MARKER TRACKING EVENTS
        // ==========================================
        const marker = document.getElementById('hiro-marker');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const scannerHint = document.getElementById('scanner-hint');

        marker.addEventListener('markerFound', () => {
            statusDot.classList.add('active');
            statusText.innerText = 'TARGET ACQUIRED [60 FPS]';
            statusText.style.color = '#00e696';
            scannerHint.classList.add('hidden');
            playSciFiSound('found');
        });

        marker.addEventListener('markerLost', () => {
            statusDot.classList.remove('active');
            statusText.innerText = 'SCANNING FOR MARKER...';
            statusText.style.color = '#00d4ff';
            scannerHint.classList.remove('hidden');
        });

        // Hide loader when 3D scene finishes loading
        document.querySelector('a-scene').addEventListener('loaded', () => {
            setTimeout(() => {
                const loader = document.getElementById('loader');
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 600);
            }, 1000);
        });

        // ==========================================
        // MODE SWITCHER (ROBOT vs EARTH vs ASTRONAUT)
        // ==========================================
        const descriptions = {
            robot: {
                title: "🤖 Cyber Android (Interactive Skeletal Avatar)",
                desc: "High-polygon rigged 3D character with skeletal animations (Dance, Jump, Wave). Demonstrates gaming and interactive avatar AR."
            },
            earth: {
                title: "🌍 Photorealistic Earth & Atmospheric Shaders",
                desc: "NASA 2K surface texture mapping, independent rotating cloud layer, and orbiting detailed Moon. Demonstrates educational and scientific AR."
            },
            astro: {
                title: "🧑‍🚀 High-Definition Apollo Space Suit (PBR)",
                desc: "Physically-Based Rendering (PBR) metallic and fabric materials with specular reflections. Demonstrates e-commerce & digital twin AR."
            }
        };

        function switchMode(mode) {
            playSciFiSound('switch');

            document.getElementById('scene-robot').setAttribute('visible', 'false');
            document.getElementById('scene-earth').setAttribute('visible', 'false');
            document.getElementById('scene-astro').setAttribute('visible', 'false');

            document.getElementById(`scene-${mode}`).setAttribute('visible', 'true');

            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${mode}`).classList.add('active');

            // Show/hide robot actions
            document.getElementById('robot-actions').style.display = (mode === 'robot') ? 'flex' : 'none';

            // Update info card
            document.getElementById('card-title').innerText = descriptions[mode].title;
            document.getElementById('card-desc').innerText = descriptions[mode].desc;
        }

        // Show robot actions by default
        document.getElementById('robot-actions').style.display = 'flex';

        // ==========================================
        // SKELETAL ANIMATION CONTROLLER (ROBOT)
        // ==========================================
        function playAnim(clipName) {
            playSciFiSound('anim');
            const robot = document.getElementById('robot-entity');
            if (robot) {
                robot.setAttribute('animation-mixer', {
                    clip: clipName,
                    loop: 'repeat',
                    crossFadeDuration: 0.4
                });
            }
        }

        // ==========================================
        // CONTROLS (AUDIO, FREEZE, SCALE)
        // ==========================================
        let isFrozen = false;
        let currentScale = 1;

        function toggleFreeze() {
            playSciFiSound('switch');
            isFrozen = !isFrozen;
            const btn = document.getElementById('btn-freeze');
            if (isFrozen) {
                btn.innerText = '▶️ Resume';
                btn.classList.add('active');
                document.querySelector('a-scene').pause();
            } else {
                btn.innerText = '⏸️ Pause';
                btn.classList.remove('active');
                document.querySelector('a-scene').play();
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('btn-sound');
            btn.innerText = soundEnabled ? '🔊 Audio: ON' : '🔇 Audio: OFF';
            if (soundEnabled) btn.classList.remove('active');
            else btn.classList.add('active');
            if (soundEnabled) playSciFiSound('switch');
        }

        function toggleScale() {
            playSciFiSound('switch');
            currentScale = (currentScale === 1) ? 1.5 : (currentScale === 1.5) ? 0.7 : 1;
            document.getElementById('btn-scale').innerText = `🔍 Scale: ${currentScale}x`;
            
            ['scene-robot', 'scene-earth', 'scene-astro'].forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    const base = (id === 'scene-robot') ? 0.28 : (id === 'scene-astro') ? 0.32 : 1;
                    const s = base * currentScale;
                    el.setAttribute('scale', `${s} ${s} ${s}`);
                }
            });
        }
    </script>
</body>
</html>
