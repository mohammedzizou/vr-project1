<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Apple Vision Pro — Spatial Cinema AR Experience</title>
    <!-- Three.js for high-performance 3D spatial rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            color: #fff;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* Real-Time Camera Background */
        #camera-feed {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            object-fit: cover;
            z-index: 1;
        }

        /* 3D WebGL Canvas Layer */
        #webgl-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 2;
            pointer-events: auto;
        }

        /* Glassmorphism VisionOS UI Overlay */
        #vision-ui {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
        }
        .vision-badge {
            background: rgba(20, 25, 45, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 8px 16px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .apple-logo {
            font-size: 14px;
        }
        .back-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            backdrop-filter: blur(20px);
            transition: all 0.2s;
        }
        .back-btn:active {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0.96);
        }

        /* Spatial Instruction Pill */
        .spatial-pill {
            align-self: center;
            background: rgba(10, 15, 30, 0.75);
            border: 1px solid rgba(0, 212, 255, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 11.5px;
            color: #d0e8ff;
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.2);
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: auto;
        }
        .pulse-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: #00d4ff;
            box-shadow: 0 0 8px #00d4ff;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.7); opacity: 0.5; }
        }

        /* Bottom Floating Spatial Media Controller (VisionOS Dock) */
        .bottom-bar {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            pointer-events: auto;
        }
        .vision-dock {
            background: rgba(15, 20, 40, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 40px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
        }
        .dock-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            width: 44px; height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .dock-btn:active, .dock-btn.active {
            background: linear-gradient(135deg, #00d4ff, #387aff);
            border-color: #00d4ff;
            color: #050b1a;
            transform: scale(1.08);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.6);
        }
        .dock-divider {
            width: 1px; height: 26px;
            background: rgba(255, 255, 255, 0.2);
        }

        /* Screen Size Selector */
        .size-chips {
            display: flex;
            gap: 8px;
        }
        .size-chip {
            background: rgba(10, 15, 30, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #bcd;
            padding: 5px 12px;
            border-radius: 14px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(15px);
            transition: all 0.2s;
        }
        .size-chip.active {
            border-color: #00d4ff;
            color: #00d4ff;
            background: rgba(0, 212, 255, 0.15);
        }

        /* Permission Prompt Modal */
        #perm-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 10, 25, 0.95);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
        }
        .perm-card {
            background: rgba(20, 30, 60, 0.85);
            border: 1px solid rgba(0, 212, 255, 0.4);
            backdrop-filter: blur(30px);
            border-radius: 24px;
            padding: 32px 24px;
            max-width: 380px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }
        .perm-card h2 {
            font-size: 22px;
            margin: 12px 0 8px 0;
            color: #00d4ff;
            letter-spacing: 0.5px;
        }
        .perm-card p {
            font-size: 13px;
            line-height: 1.5;
            color: #ccddee;
            margin-bottom: 24px;
        }
        .start-btn {
            background: linear-gradient(135deg, #00d4ff, #387aff);
            color: #050b1a;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(0, 212, 255, 0.5);
            width: 100%;
            transition: transform 0.2s;
        }
        .start-btn:active { transform: scale(0.97); }

        /* Hidden Video Source */
        #video-source {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Camera Feed (Real Room Passthrough) -->
    <video id="camera-feed" autoplay playsinline muted></video>

    <!-- 3D Three.js WebGL Canvas -->
    <canvas id="webgl-canvas"></canvas>

    <!-- Hidden Video Player (Audio enabled) -->
    <video id="video-source" loop playsinline webkit-playsinline crossorigin="anonymous" src="ar_screen_video.mp4"></video>

    <!-- Permission & Intro Overlay -->
    <div id="perm-overlay">
        <div class="perm-card">
            <div style="font-size: 42px;">🥽</div>
            <h2>Apple Vision Pro Mode</h2>
            <p>Experience <strong>Spatial Computing</strong> in your room. A floating 100-inch virtual cinema screen will hover in 3D space with spatial audio and glassmorphism borders.</p>
            <button class="start-btn" onclick="startSpatialExperience()">🚀 Launch Spatial Screen</button>
        </div>
    </div>

    <!-- VisionOS Glass UI -->
    <div id="vision-ui">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="vision-badge">
                <span class="apple-logo"></span>
                <span>SPATIAL CINEMA DISPLAY</span>
            </div>
            <a href="index.html" class="back-btn">🤖 3D Robot Mode</a>
        </div>

        <!-- Floating Spatial Pill -->
        <div class="spatial-pill">
            <div class="pulse-dot"></div>
            <span>Screen anchored in 3D room &bull; Drag to rotate &bull; Pinch to scale</span>
        </div>

        <!-- Bottom Controls Dock -->
        <div class="bottom-bar">
            <div class="size-chips">
                <button class="size-chip" onclick="setScreenSize(0.7)">55" TV</button>
                <button class="size-chip active" onclick="setScreenSize(1.0)">100" Cinema</button>
                <button class="size-chip" onclick="setScreenSize(1.4)">150" IMAX</button>
            </div>

            <div class="vision-dock">
                <button class="dock-btn active" id="btn-play" onclick="togglePlay()" title="Play/Pause">⏸️</button>
                <button class="dock-btn" id="btn-mute" onclick="toggleMute()" title="Audio Mute/Unmute">🔊</button>
                <div class="dock-divider"></div>
                <button class="dock-btn" onclick="resetPosition()" title="Recenter in Room">🎯</button>
                <button class="dock-btn" id="btn-curve" onclick="toggleCurve()" title="Curved/Flat Screen">🌐</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. CAMERA PASSTHROUGH (REAL ROOM AR)
        // ==========================================
        const cameraFeed = document.getElementById('camera-feed');
        const videoSource = document.getElementById('video-source');
        const permOverlay = document.getElementById('perm-overlay');

        async function startSpatialExperience() {
            try {
                // Request back camera
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' },
                    audio: false
                });
                cameraFeed.srcObject = stream;
                await cameraFeed.play();
            } catch (err) {
                console.log("Webcam fallback for desktop:", err);
                try {
                    const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    cameraFeed.srcObject = fallbackStream;
                    await cameraFeed.play();
                } catch(e) {
                    // If no camera, show dark space background
                    cameraFeed.style.display = 'none';
                    document.body.style.background = 'radial-gradient(circle at center, #101830 0%, #050814 100%)';
                }
            }

            // Start video playback
            videoSource.play().catch(e => console.log('Autoplay handled:', e));

            // Hide overlay
            permOverlay.style.opacity = '0';
            setTimeout(() => permOverlay.style.display = 'none', 400);

            // Init device orientation for gyro tracking if available
            if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(state => {
                    if (state === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation);
                    }
                }).catch(console.error);
            } else if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientation', handleOrientation);
            }
        }

        // ==========================================
        // 2. THREE.JS 3D SPATIAL DISPLAY
        // ==========================================
        const canvas = document.getElementById('webgl-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 0, 3.2);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0x00d4ff, 2, 8);
        pointLight.position.set(0, 1.5, 2);
        scene.add(pointLight);

        // Video Texture
        const videoTexture = new THREE.VideoTexture(videoSource);
        videoTexture.minFilter = THREE.LinearFilter;
        videoTexture.magFilter = THREE.LinearFilter;
        videoTexture.format = THREE.RGBAFormat;

        // Screen Parent Group
        const screenGroup = new THREE.Group();
        screenGroup.position.set(0, 0, 0);
        scene.add(screenGroup);

        // A. Video Screen Plane (Curved Cinema Style)
        let isCurved = true;
        const screenW = 2.4;
        const screenH = 1.35; // 16:9 ratio
        
        // Curved Cinema Geometry
        const curvedGeo = new THREE.CylinderGeometry(2.8, 2.8, screenH, 48, 1, true, -Math.PI / 6, Math.PI / 3);
        const flatGeo = new THREE.PlaneGeometry(screenW, screenH, 32, 32);

        const videoMat = new THREE.MeshBasicMaterial({
            map: videoTexture,
            side: THREE.DoubleSide
        });
        const screenMesh = new THREE.Mesh(curvedGeo, videoMat);
        screenMesh.rotation.y = Math.PI; // Face camera
        screenGroup.add(screenMesh);

        // B. Frosted Glass Frame / Bezel (Apple Vision Pro Aesthetic)
        const frameMat = new THREE.MeshPhysicalMaterial({
            color: 0x0a1428,
            metalness: 0.2,
            roughness: 0.1,
            transmission: 0.7,
            transparent: true,
            opacity: 0.85,
            reflectivity: 0.9,
            clearcoat: 1.0,
            clearcoatRoughness: 0.1,
            side: THREE.DoubleSide
        });
        const frameGeo = new THREE.PlaneGeometry(screenW + 0.12, screenH + 0.12);
        const frameMesh = new THREE.Mesh(frameGeo, frameMat);
        frameMesh.position.z = -0.01;
        screenGroup.add(frameMesh);

        // C. Glowing Ambient Bezel Edge (Cyan Neon Halo)
        const glowMat = new THREE.MeshBasicMaterial({
            color: 0x00d4ff,
            transparent: true,
            opacity: 0.45,
            wireframe: true
        });
        const glowGeo = new THREE.PlaneGeometry(screenW + 0.16, screenH + 0.16);
        const glowMesh = new THREE.Mesh(glowGeo, glowMat);
        glowMesh.position.z = -0.015;
        screenGroup.add(glowMesh);

        // D. Floating Spatial Audio Speakers on Left & Right
        const speakerMat = new THREE.MeshStandardMaterial({ color: 0x111c38, roughness: 0.3, metalness: 0.8 });
        const leftSpeaker = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.6, 16), speakerMat);
        leftSpeaker.position.set(-screenW / 2 - 0.12, 0, 0);
        screenGroup.add(leftSpeaker);

        const rightSpeaker = leftSpeaker.clone();
        rightSpeaker.position.set(screenW / 2 + 0.12, 0, 0);
        screenGroup.add(rightSpeaker);

        // ==========================================
        // 3. TOUCH & GESTURE CONTROLS (ROTATION, PINCH ZOOM)
        // ==========================================
        let isDragging = false;
        let prevMouseX = 0;
        let prevMouseY = 0;
        let targetRotX = 0;
        let targetRotY = 0;
        let initialPinchDist = 0;
        let currentScale = 1;

        window.addEventListener('mousedown', (e) => {
            isDragging = true;
            prevMouseX = e.clientX;
            prevMouseY = e.clientY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - prevMouseX;
            const deltaY = e.clientY - prevMouseY;
            targetRotY += deltaX * 0.005;
            targetRotX += deltaY * 0.005;
            prevMouseX = e.clientX;
            prevMouseY = e.clientY;
        });

        window.addEventListener('mouseup', () => isDragging = false);

        // Touch gestures for mobile
        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                prevMouseX = e.touches[0].clientX;
                prevMouseY = e.touches[0].clientY;
            } else if (e.touches.length === 2) {
                isDragging = false;
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                initialPinchDist = Math.hypot(dx, dy);
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1 && isDragging) {
                const deltaX = e.touches[0].clientX - prevMouseX;
                const deltaY = e.touches[0].clientY - prevMouseY;
                targetRotY += deltaX * 0.006;
                targetRotX += deltaY * 0.006;
                prevMouseX = e.touches[0].clientX;
                prevMouseY = e.touches[0].clientY;
            } else if (e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const dist = Math.hypot(dx, dy);
                if (initialPinchDist > 0) {
                    const factor = dist / initialPinchDist;
                    currentScale = Math.min(Math.max(currentScale * factor, 0.4), 2.5);
                    screenGroup.scale.set(currentScale, currentScale, currentScale);
                    initialPinchDist = dist;
                }
            }
        });

        window.addEventListener('touchend', () => isDragging = false);

        // Subtle Gyroscope motion for mobile immersion
        function handleOrientation(e) {
            if (e.gamma !== null && e.beta !== null) {
                const gyroY = (e.gamma / 90) * 0.2;
                const gyroX = ((e.beta - 45) / 90) * 0.2;
                camera.position.x += (gyroY - camera.position.x) * 0.05;
                camera.position.y += (-gyroX - camera.position.y) * 0.05;
            }
        }

        // ==========================================
        // 4. VISIONOS CONTROLS
        // ==========================================
        function togglePlay() {
            const btn = document.getElementById('btn-play');
            if (videoSource.paused) {
                videoSource.play();
                btn.innerText = '⏸️';
                btn.classList.add('active');
            } else {
                videoSource.pause();
                btn.innerText = '▶️';
                btn.classList.remove('active');
            }
        }

        function toggleMute() {
            const btn = document.getElementById('btn-mute');
            videoSource.muted = !videoSource.muted;
            btn.innerText = videoSource.muted ? '🔇' : '🔊';
            btn.classList.toggle('active', !videoSource.muted);
        }

        function resetPosition() {
            targetRotX = 0;
            targetRotY = 0;
            screenGroup.position.set(0, 0, 0);
            currentScale = 1;
            screenGroup.scale.set(1, 1, 1);
            camera.position.set(0, 0, 3.2);
        }

        function setScreenSize(scaleMultiplier) {
            document.querySelectorAll('.size-chip').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            currentScale = scaleMultiplier;
            screenGroup.scale.set(currentScale, currentScale, currentScale);
        }

        function toggleCurve() {
            isCurved = !isCurved;
            const btn = document.getElementById('btn-curve');
            btn.classList.toggle('active', isCurved);
            screenMesh.geometry = isCurved ? curvedGeo : flatGeo;
            screenMesh.rotation.y = isCurved ? Math.PI : 0;
        }

        // Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ==========================================
        // 5. ANIMATION LOOP (60 FPS)
        // ==========================================
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            // Smooth rotation interpolation
            screenGroup.rotation.y += (targetRotY - screenGroup.rotation.y) * 0.1;
            screenGroup.rotation.x += (targetRotX - screenGroup.rotation.x) * 0.1;

            // Gentle floating hovering motion (VisionOS spatial physics)
            const elapsedTime = clock.getElapsedTime();
            screenGroup.position.y = Math.sin(elapsedTime * 1.5) * 0.03;

            // Subtle neon pulse
            glowMat.opacity = 0.35 + Math.sin(elapsedTime * 3) * 0.15;

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
